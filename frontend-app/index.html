<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOA Profile</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f7fb;
            --panel: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --line: #d8e0ea;
            --blue: #2563eb;
            --green: #16a34a;
            --red: #dc2626;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            padding: 24px;
        }

        .card {
            width: min(420px, 100%);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 28px;
            box-shadow: 0 12px 28px rgba(31, 41, 55, 0.08);
        }

        h1 {
            font-size: 24px;
            margin: 0 0 20px;
            text-align: center;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
            font: inherit;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
            padding: 12px;
            margin-bottom: 10px;
        }

        .blue { background: var(--blue); }
        .green { background: var(--green); }
        .link {
            background: transparent;
            color: var(--red);
            margin: 6px 0 0;
        }

        .status {
            min-height: 18px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            margin-top: 10px;
        }

        .avatar {
            width: 112px;
            height: 112px;
            border-radius: 50%;
            border: 1px solid var(--line);
            object-fit: cover;
            display: none;
            margin: 0 auto 16px;
            background: #eef2f7;
        }

        #profileBox {
            display: none;
        }
    </style>
</head>
<body>
    <main id="authBox" class="card">
        <h1>SOAP Login</h1>
        <input id="user" autocomplete="username" placeholder="Username">
        <input id="pass" type="password" autocomplete="current-password" placeholder="Password">
        <button class="green" onclick="doRegister()">Register</button>
        <button class="blue" onclick="doLogin()">Login</button>
        <div id="authStatus" class="status"></div>
    </main>

    <main id="profileBox" class="card">
        <h1>User Profile</h1>
        <img id="profileImage" class="avatar" alt="Profile image">
        <input type="file" id="imageInput" accept="image/*">
        <button class="green" onclick="uploadImage()">Upload Image</button>
        <input id="name" placeholder="Name">
        <textarea id="bio" placeholder="Bio" rows="3"></textarea>
        <input id="phone" placeholder="Phone">
        <button class="blue" onclick="saveProfile()">Save Profile</button>
        <button class="link" onclick="logout()">Logout</button>
        <div id="profileStatus" class="status"></div>
    </main>

    <script>
        let sessionToken = "";
        const API_BASE = window.API_BASE_URL || "https://hammerhead-app-fqp4n.ondigitalocean.app";
        const SOAP_URL = `${API_BASE}/api/soap`;
        const REST_URL = `${API_BASE}/api/users`;

        function setStatus(id, message, color = "") {
            const element = document.getElementById(id);
            element.textContent = message;
            element.style.color = color;
        }

        function soapEnvelope(body) {
            return `
                <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:auth="http://example.com/auth">
                    <soapenv:Body>${body}</soapenv:Body>
                </soapenv:Envelope>`;
        }

        async function sendSoap(body) {
            const response = await fetch(SOAP_URL, {
                method: "POST",
                headers: { "Content-Type": "text/xml" },
                body: soapEnvelope(body),
            });
            return response.text();
        }

        async function doRegister() {
            const username = document.getElementById("user").value.trim();
            const password = document.getElementById("pass").value;
            const xml = await sendSoap(`
                <auth:RegisterRequest>
                    <auth:username>${username}</auth:username>
                    <auth:password>${password}</auth:password>
                </auth:RegisterRequest>`);

            if (xml.includes("registered successfully")) {
                setStatus("authStatus", "Registered. You can log in now.", "green");
            } else {
                setStatus("authStatus", "Register failed.", "red");
            }
        }

        async function doLogin() {
            const username = document.getElementById("user").value.trim();
            const password = document.getElementById("pass").value;
            const xml = await sendSoap(`
                <auth:LoginRequest>
                    <auth:username>${username}</auth:username>
                    <auth:password>${password}</auth:password>
                </auth:LoginRequest>`);

            const doc = new DOMParser().parseFromString(xml, "text/xml");
            const tokenNode = doc.getElementsByTagNameNS("*", "token")[0] || doc.getElementsByTagName("token")[0];
            const token = tokenNode?.textContent;

            if (!token || token === "AUTH_FAILED") {
                setStatus("authStatus", "Wrong username or password.", "red");
                return;
            }

            sessionToken = token;
            document.getElementById("authBox").style.display = "none";
            document.getElementById("profileBox").style.display = "block";
            await loadProfile();
        }

        async function loadProfile() {
            const response = await fetch(`${REST_URL}/me`, {
                headers: { Authorization: `Bearer ${sessionToken}` },
            });

            if (!response.ok) {
                setStatus("profileStatus", "Could not load profile.", "red");
                return;
            }

            const profile = await response.json();
            document.getElementById("name").value = profile.name || "";
            document.getElementById("bio").value = profile.bio || "";
            document.getElementById("phone").value = profile.phone || "";

            if (profile.imageUrl) {
                const image = document.getElementById("profileImage");
                image.src = profile.imageUrl;
                image.style.display = "block";
            }
        }

        async function saveProfile() {
            const payload = {
                name: document.getElementById("name").value,
                bio: document.getElementById("bio").value,
                phone: document.getElementById("phone").value,
            };

            const response = await fetch(`${REST_URL}/me`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${sessionToken}`,
                },
                body: JSON.stringify(payload),
            });

            setStatus(
                "profileStatus",
                response.ok ? "Profile saved." : "Token is invalid or profile save failed.",
                response.ok ? "green" : "red"
            );
        }

        async function uploadImage() {
            const file = document.getElementById("imageInput").files[0];
            if (!file) {
                setStatus("profileStatus", "Choose an image first.", "red");
                return;
            }

            const formData = new FormData();
            formData.append("file", file);
            setStatus("profileStatus", "Uploading image...", "var(--blue)");

            const response = await fetch(`${REST_URL}/me/image`, {
                method: "POST",
                headers: { Authorization: `Bearer ${sessionToken}` },
                body: formData,
            });

            if (!response.ok) {
                setStatus("profileStatus", "Image upload failed.", "red");
                return;
            }

            const profile = await response.json();
            const image = document.getElementById("profileImage");
            image.src = profile.imageUrl;
            image.style.display = "block";
            setStatus("profileStatus", "Image uploaded.", "green");
        }

        function logout() {
            sessionToken = "";
            location.reload();
        }
    </script>
</body>
</html>
